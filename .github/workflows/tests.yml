name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Run unit and HTTP tests
        run: PYTHONPATH=src python3 -m unittest discover -s tests -v
      - name: Compile Python
        run: python3 -m compileall -q src tools tests
      - name: Check installer bundle
        run: python3 tools/build_installer.py --check
      - name: Check shell syntax
        run: bash -n install.sh
